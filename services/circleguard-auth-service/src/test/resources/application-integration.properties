# JWT Configuration
jwt.secret=my-super-secret-dev-key-32-chars-long-12345678
qr.secret=my-qr-secret-key-for-dev-1234567890

# Database Configuration for tests
spring.flyway.enabled=false
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# LDAP Configuration (mock for tests)
spring.ldap.urls=ldap://localhost:389
spring.ldap.base=dc=circleguard,dc=edu
spring.ldap.username=cn=admin,dc=circleguard,dc=edu
spring.ldap.password=admin

# Identity Service URL (mock)
identity.service.url=http://localhost:8099

# Security
spring.security.enabled=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true