apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: stage
  labels:
    app: redis
    environment: stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: stage
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379