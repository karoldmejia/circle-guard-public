apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: prod
  labels:
    app: notification-service
    environment: prod
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: circleguard/notification-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: AUTH_API_URL
              value: "http://auth-service:8180"
            - name: SPRING_MAIL_HOST
              value: "smtp.prod.company.com"  # ← SMTP real en prod
            - name: SPRING_MAIL_PORT
              value: "587"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: prod
spec:
  selector:
    app: notification-service
  ports:
    - port: 8082
      targetPort: 8082